<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Arwaa | ポートフォリオ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', MeiYo, sans-serif;
            background-color: #fff0f5;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.15);
            border: 3px solid #f472b6;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            background: #fbcfe8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        h1 {
            color: #db2777;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #9d174d;
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        p {
            line-height: 1.8;
            font-size: 15px;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            background-color: #f472b6;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #ec4899;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #f472b6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">🌸</div>
        <h1>ムハンマド・アルワ</h1>
        <div class="subtitle">Muhammad Arwaa Savana Permana</div>
        <p>
            ようこそ！私の公式ウェブサイトへ。<br>
            ご訪問いただきありがとうございます。
        </p>
        <div class="links">
            <a href="https://github.com/muhammadarwaa" class="btn">GitHub プロフィール</a>
        </div>
        <div class="footer">
            ♥ ありがとうございます ♥
        </div>
    </div>
</body>
</html>
